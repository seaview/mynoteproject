<script>
  try {
    var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme');

<style>
  :root { --bg:#f5f6f4; --side:#1f2a24; --sidetx:#d9e2dc; --card:#fff; --text:#1d1d1b; --muted:#77776f; --line:#e3e3dc; --accent:#00a82d; --danger:#d23b3b; --sel:#e9f7ee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg:#161618; --side:#101311; --card:#212125; --text:#ececea; --muted:#8e8e95; --line:#34343a; --accent:#2ecc5a; --danger:#ff6b6b; --sel:#1d3326; } }
  :root[data-theme=dark] { --bg:#161618; --side:#101311; --card:#212125; --text:#ececea; --muted:#8e8e95; --line:#34343a; --accent:#2ecc5a; --danger:#ff6b6b; --sel:#1d3326; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  input, textarea, button, select { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 10px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--danger); }
  input[type=text], input[type=search], input[type=date], select { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 10px; }
  #app { display:grid; grid-template-columns:230px 340px 1fr; height:100vh; }
  #side, #list, #note, #page { min-height:0; overflow:auto; }
  /* sidebar */
  #side { background:var(--side); color:var(--sidetx); display:flex; flex-direction:column; padding:12px 8px; gap:4px; }
  #side h1 { font-size:18px; margin:2px 8px 8px; color:#fff; }
  #side input { background:#ffffff14; border-color:#ffffff22; color:#fff; margin:0 4px 6px; width:calc(100% - 8px); }
  #side .newbtn { margin:0 4px 8px; width:calc(100% - 8px); padding:9px; }
  #sidenav { display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav { display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px; cursor:pointer; user-select:none; }
  .nav:hover { background:#ffffff14; }
  .nav.on { background:#ffffff26; color:#fff; font-weight:600; }
  .nav .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav .ct { font-size:12px; opacity:.7; }
  .nav .mini { display:none; background:none; border:0; color:inherit; padding:0 4px; }
  .nav:hover .mini { display:inline; }
  .nav.add { opacity:.8; border:1px dashed #ffffff44; margin:4px 4px 0; }
  .sec { display:flex; justify-content:space-between; align-items:center; margin:12px 10px 2px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; opacity:.6; }
  .stack { margin:6px 10px 0; font-size:12px; opacity:.55; }
  .nbform { margin:4px; display:grid; gap:4px; }
  .nbform input { margin:0 !important; width:100% !important; }
  .nbform div { display:flex; gap:4px; } .nbform button { flex:1; background:#ffffff14; border-color:#ffffff22; }
  .foot { margin-top:auto; display:flex; gap:6px; flex-wrap:wrap; padding:8px 4px 0; }
  .foot button { background:#ffffff14; border-color:#ffffff22; color:inherit; font-size:12px; padding:5px 8px; }
  /* list */
  #list { background:var(--card); border-right:1px solid var(--line); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .lhead { display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:1; }
  .lhead b { flex:1; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fbar { display:grid; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .fbar .frow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .fbar .frow > span { width:42px; color:var(--muted); }
  .fbar input, .fbar select, .fbar button { padding:4px 8px; font-size:13px; }
  .fbar input[type=search] { width:100%; }
  .fbar input[type=date] { width:112px; padding:4px 4px; }
  .fbar select { max-width:96px; }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:var(--bg); }
  .item.on { background:var(--sel); }
  .item .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .s { color:var(--muted); font-size:13px; max-height:2.9em; overflow:hidden; }
  .item .s mark { background:#ffe45c; color:#000; border-radius:2px; }
  .item .m { color:var(--muted); font-size:12px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
  .empty { color:var(--muted); text-align:center; padding:40px 16px; }
  /* editor */
  #note { background:var(--card); display:flex; flex-direction:column; }
  #note .none { margin:auto; color:var(--muted); }
  .tb { display:flex; flex-wrap:wrap; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); align-items:center; }
  .tb button { padding:4px 9px; min-width:32px; }
  .tb .sp { flex:1; }
  #meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 20px 0; }
  .chip { display:inline-flex; align-items:center; gap:4px; background:var(--sel); border:1px solid var(--line); border-radius:99px; padding:1px 4px 1px 10px; font-size:13px; }
  .chip button { border:0; background:none; padding:0 4px; color:var(--muted); }
  #ttl { border:0; outline:0; font-size:26px; font-weight:700; padding:12px 20px 4px; background:transparent; width:100%; }
  #find { display:none; padding:6px 20px; gap:6px; }
  #find.on { display:flex; }
  #ed { flex:1; padding:10px 20px 30px; outline:0; overflow-wrap:anywhere; min-height:200px; }
  #ed img { max-width:100%; height:auto; }
  #ed table { border-collapse:collapse; } #ed td, #ed th { border:1px solid var(--line); padding:4px 8px; min-width:60px; }
  #ed blockquote { border-left:3px solid var(--accent); margin:8px 0; padding-left:12px; color:var(--muted); }
  #ed pre { background:var(--bg); padding:10px; border-radius:8px; overflow:auto; }
  #ed mark { background:#ffe45c; color:#000; }
  #ed ul.todo { list-style:none; padding-left:4px; }
  #ed ul.todo li { padding-left:26px; position:relative; }
  #ed ul.todo li::before { content:"\2610"; position:absolute; left:0; font-size:18px; cursor:pointer; }
  #ed ul.todo li[data-done="1"]::before { content:"\2611"; color:var(--accent); }
  #ed ul.todo li[data-done="1"] { text-decoration:line-through; color:var(--muted); }
  #atts { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 14px; }
  .att { display:flex; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:13px; }
  .att a { color:var(--accent); text-decoration:none; }
  .att button { border:0; background:none; padding:0 2px; }
  #trashbar { display:none; padding:8px 20px; background:#fff3cd; color:#5b4a00; gap:8px; align-items:center; }
  /* tasks/templates page */
  #page { display:none; grid-column:2 / 4; background:var(--card); padding:20px 24px; border-left:1px solid var(--line); }
  #page h2 { margin:0 0 12px; }
  .trow { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .trow input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); }
  .trow .tx { flex:1; overflow-wrap:anywhere; } .trow.done .tx { text-decoration:line-through; color:var(--muted); }
  .due { font-size:12px; color:var(--muted); } .due.over { color:var(--danger); font-weight:600; } .due.today { color:#c77700; font-weight:600; }
  .addrow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; } .addrow input[type=text] { flex:1; min-width:160px; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; } .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; background:var(--bg); }
  .card:hover { border-color:var(--accent); } .card b { display:block; margin-bottom:4px; } .card span { font-size:13px; color:var(--muted); }
  #status { position:fixed; right:12px; bottom:10px; font-size:13px; color:var(--muted); background:var(--card); border-radius:8px; padding:2px 8px; }
  #status.err { color:#fff; background:var(--danger); font-weight:600; }
  #back, #menu { display:none; }
  .hint { font-size:12px; opacity:.6; margin:10px 10px 0; }
  /* iPhone notch / home-indicator safe areas (all env() values are 0 on desktop) */
  #side { padding-top:calc(12px + env(safe-area-inset-top)); padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  .lhead { padding-top:calc(12px + env(safe-area-inset-top)); }
  #note .tb:first-child, #trashbar { padding-top:calc(8px + env(safe-area-inset-top)); }
  #page { padding-top:calc(20px + env(safe-area-inset-top)); }
  #ed { padding-bottom:calc(30px + env(safe-area-inset-bottom)); }
  #status { bottom:calc(10px + env(safe-area-inset-bottom)); }
  #app { padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  /* phone layout */
  @media (max-width: 820px) {
    #app { display:block; }
    #side, #list, #note, #page { display:none; width:100%; height:100vh; height:100dvh; }
    input, select, textarea { font-size:16px !important; }   /* stops iOS Safari zooming in on focus */
    #note .tb { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; flex-shrink:0; }
    #note .tb button { flex-shrink:0; white-space:nowrap; }
    #note .tb .sp { display:none; }
    button { -webkit-tap-highlight-color:transparent; }
    body[data-pane=nav] #side { display:flex; }
    body[data-pane=list]:not(.paged) #list { display:flex; }
    body[data-pane=note]:not(.paged) #note { display:flex; }
    body[data-pane=list].paged #page { display:block; }
    #back, #menu { display:inline-block; }
    #ed { font-size:16px; }
  }
  @media (pointer: coarse) { button, input, select { min-height:40px; } .nav .mini { display:inline; } }
  @media (min-width: 821px) { body.paged #list, body.paged #note { display:none; } body.paged #page { display:block; } }
  @media print { #side, #list, .tb, #meta, #page, #find, #atts, #status, #trashbar { display:none !important; } #app { display:block; } #note { display:block !important; overflow:visible; } }
</style>

<body data-pane="list">
<div id="app">
  <nav id="side"></nav>
  <section id="list"></section>
  <section id="note"></section>
  <section id="page"></section>
</div>
<div id="status"></div>
<input type="file" id="fileAtt" hidden multiple>
<input type="file" id="fileImg" hidden accept="image/*" multiple>
<input type="file" id="fileEnex" hidden accept=".enex,.xml">
<script>
// MODE: 'server' = PC app on localhost (SQLite via server.ps1); 'device' = stand-alone, notes stored in this
// browser's IndexedDB (the iPhone/PWA version, any non-localhost host, or localhost with ?local); 'demo' = temporary sample data.
const QS = new URLSearchParams(location.search);
const MODE = QS.has('demo') ? 'demo' : (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname) && !QS.has('local')) ? 'server' : 'device';
const DEMO = MODE === 'demo';
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- state ---------- */
// S = small "meta" document stored in the database: notebooks, tasks, templates, id counter.
let S = { notebooks: [], tasks: [], templates: [], nextId: 1 };
// Notes live in the database. The page holds only the current result list and the open note.
let list = [], counts = { all: 0, pinned: 0, trash: 0, nb: {}, tags: {} }, curNote = null, sel = null;
let view = { type: 'all' }, q = '', loaded = false, taskTab = 'open', pane = 'list', addingNb = false;
const F = { title: '', from: '', to: '', field: 'updated', sort: 'updated', order: 'desc' };   // list filters
const newId = () => S.nextId++;
const cur = () => curNote;
const textOf = html => new DOMParser().parseFromString(html || '', 'text/html').body.textContent.replace(/\s+/g, ' ').trim();

function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.className = err ? 'err' : ''; s.style.display = msg ? '' : 'none'; }

/* ---------- storage backends: the real server (SQLite) or an in-memory copy for ?demo ---------- */
const JSONH = { 'Content-Type': 'application/json' };
const ok = r => { if (!r.ok) throw new Error(r.status); return r; };
const netApi = {
  list: p => fetch('/api/notes?' + new URLSearchParams(p), { cache: 'no-store' }).then(ok).then(r => r.json()),
  get: id => fetch('/api/notes/' + id, { cache: 'no-store' }).then(ok).then(r => r.json()),
  create: b => fetch('/api/notes', { method: 'POST', headers: JSONH, body: JSON.stringify(b) }).then(ok).then(r => r.json()),
  save: (id, b, keep) => fetch('/api/notes/' + id, { method: 'PUT', headers: JSONH, body: JSON.stringify(b), keepalive: !!keep }).then(ok),
  del: id => fetch('/api/notes/' + id, { method: 'DELETE' }).then(ok),
  emptyTrash: () => fetch('/api/notes?view=trash', { method: 'DELETE' }).then(ok),
  summary: () => fetch('/api/summary', { cache: 'no-store' }).then(ok).then(r => r.json()),
  getMeta: () => fetch('/api/meta', { cache: 'no-store' }).then(ok).then(r => r.json()),
  putMeta: m => fetch('/api/meta', { method: 'PUT', headers: JSONH, body: JSON.stringify({ notebooks: m.notebooks, tasks: m.tasks, templates: m.templates, nextId: m.nextId }) }).then(ok),
  move: (from, to) => fetch('/api/move', { method: 'POST', headers: JSONH, body: JSON.stringify({ from, to }) }).then(ok),
  renameTag: (from, to) => fetch('/api/tag-rename', { method: 'POST', headers: JSONH, body: JSON.stringify({ from, to }) }).then(ok)
};
// In-memory note store with the same interface as netApi. `store` (optional) writes changes through to
// persistent storage; used by ?demo (no store) and by the on-device mode (IndexedDB store).
function memApi(db, store) {
  let nid = 1 + Math.max(0, ...db.map(n => n.id));
  const P = store || {};
  const snip = (n, words) => {
    if (!words.length) return n.text.slice(0, 160);
    const i = n.text.toLowerCase().indexOf(words[0]); if (i < 0) return n.text.slice(0, 160);
    return n.text.slice(Math.max(0, i - 40), i) + '<<' + n.text.slice(i, i + words[0].length) + '>>' + n.text.slice(i + words[0].length, i + 120);
  };
  return {
    async list(p) {
      let l = db.filter(n => !!n.trashed === (p.view === 'trash'));
      if (p.view === 'pinned') l = l.filter(n => n.pinned);
      if (p.nb) l = l.filter(n => n.nb == p.nb);
      if (p.nbs) { const s = p.nbs.split(',').map(Number); l = l.filter(n => s.includes(n.nb)); }
      if (p.tag) l = l.filter(n => n.tags.some(t => t.toLowerCase() === p.tag.toLowerCase()));
      if (p.title) l = l.filter(n => n.title.toLowerCase().includes(p.title.toLowerCase()));
      const f = p.field === 'created' ? 'created' : 'updated';
      if (p.from) l = l.filter(n => n[f] >= +p.from);
      if (p.to) l = l.filter(n => n[f] <= +p.to);
      if (p.has === 'image') l = l.filter(n => /<img/i.test(n.html));
      if (p.has === 'attachment') l = l.filter(n => n.att.length);
      if (p.todo === 'true') l = l.filter(n => /data-done="0"/.test(n.html));
      const words = (p.q || '').toLowerCase().split(/\s+/).filter(Boolean);
      l = l.filter(n => { const hay = (n.title + ' ' + n.text + ' ' + n.tags.join(' ')).toLowerCase(); return words.every(w => hay.includes(w)); });
      const dir = p.order === 'asc' ? 1 : -1;
      const cmp = p.sort === 'title' ? (a, b) => dir * a.title.localeCompare(b.title) : p.sort === 'created' ? (a, b) => dir * (a.created - b.created) : (a, b) => dir * (a.updated - b.updated);
      const browsing = !(words.length || p.title || p.from || p.to);
      l.sort((a, b) => (browsing ? b.pinned - a.pinned : 0) || cmp(a, b));
      return l.map(n => ({ id: n.id, title: n.title, nb: n.nb, pinned: n.pinned, trashed: n.trashed, created: n.created, updated: n.updated, tags: n.tags, att: n.att.length, snippet: snip(n, words) }));
    },
    async get(id) { return JSON.parse(JSON.stringify(db.find(n => n.id === id))); },
    async create(b) {
      const n = Object.assign({ title: '', html: '', text: '', nb: 1, pinned: 0, trashed: 0, tags: [], att: [] }, JSON.parse(JSON.stringify(b)), { id: nid++ });
      if (P.put) await P.put([n]);
      db.push(n); return { id: n.id };
    },
    async save(id, b) {
      const n = db.find(x => x.id === id), copy = Object.assign({}, n, JSON.parse(JSON.stringify(b)));
      if (P.put) await P.put([copy]);
      Object.assign(n, copy);
    },
    async del(id) { if (P.del) await P.del([id]); db.splice(db.findIndex(n => n.id === id), 1); },
    async emptyTrash() { const ids = db.filter(n => n.trashed).map(n => n.id); if (P.del) await P.del(ids); for (let i = db.length - 1; i >= 0; i--) if (db[i].trashed) db.splice(i, 1); },
    async summary() {
      const live = db.filter(n => !n.trashed), c = { all: live.length, pinned: live.filter(n => n.pinned).length, trash: db.length - live.length, nb: {}, tags: {} };
      for (const n of live) { c.nb[n.nb] = (c.nb[n.nb] || 0) + 1; for (const t of n.tags) c.tags[t] = (c.tags[t] || 0) + 1; }
      return c;
    },
    async getMeta() { return P.getMeta ? P.getMeta() : {}; },
    async putMeta(m) { if (P.putMeta) await P.putMeta(m); },
    async move(from, to) { const ch = db.filter(n => n.nb === from); if (P.put) await P.put(ch.map(n => Object.assign({}, n, { nb: to }))); for (const n of ch) n.nb = to; },
    async renameTag(from, to) {
      const ch = db.filter(n => n.tags.includes(from)), fix = n => { const t = n.tags.filter(x => x !== from); if (to && !t.includes(to)) t.push(to); return t; };
      if (P.put) await P.put(ch.map(n => Object.assign({}, n, { tags: fix(n) })));
      for (const n of ch) n.tags = fix(n);
    }
  };
}
// On-device storage: every note is one IndexedDB record; all notes are loaded into memory at start-up
// (fine for a personal notebook) and searched there, with changes written through to IndexedDB.
async function deviceApi() {
  const d = await new Promise((res, rej) => {
    const r = indexedDB.open('mynotes', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('notes', { keyPath: 'id' }); r.result.createObjectStore('meta', { keyPath: 'key' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const readAll = name => new Promise((res, rej) => { const r = d.transaction(name).objectStore(name).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const write = (name, fn) => new Promise((res, rej) => {
    const t = d.transaction(name, 'readwrite'); fn(t.objectStore(name));
    t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error);
  });
  const notes = await readAll('notes');
  const meta = Object.fromEntries((await readAll('meta')).map(r => [r.key, r.value]));
  return memApi(notes, {
    put: arr => write('notes', s => arr.forEach(n => s.put(n))),
    del: ids => write('notes', s => ids.forEach(id => s.delete(id))),
    getMeta: () => meta,
    putMeta: m => write('meta', s => ['notebooks', 'tasks', 'templates', 'nextId'].forEach(k => s.put({ key: k, value: JSON.parse(JSON.stringify(m[k])) })))
  });
}
let api = netApi;   // chosen in load()

/* ---------- loading, migration, saving ---------- */
async function load() {
  try {
    api = MODE === 'demo' ? memApi([]) : MODE === 'device' ? await deviceApi() : netApi;
    S = Object.assign({ notebooks: [], tasks: [], templates: [], nextId: 1 }, await api.getMeta());
    if (MODE === 'server') await maybeMigrate();
    if (!S.notebooks.length) {
      S.notebooks.push({ id: newId(), name: 'First Notebook', stack: '' });
      if (DEMO) S.notebooks.push({ id: newId(), name: 'Work', stack: 'Projects' });
      await api.putMeta(S);
    }
    if (DEMO) await seedDemo();
    loaded = true; setStatus('');
    if (MODE === 'device') {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // ask the browser not to evict our data

const OK = new Set('P DIV BR B STRONG I EM U S STRIKE DEL H1 H2 H3 UL OL LI BLOCKQUOTE PRE CODE A IMG TABLE THEAD TBODY TR TD TH HR SPAN MARK'.split(' '));
const DROP = new Set('SCRIPT STYLE IFRAME OBJECT EMBED LINK META NOSCRIPT SVG MATH FORM TEMPLATE TITLE HEAD'.split(' '));
function cleanNode(node) {

    if (c.nodeType === 3) continue;
    if (c.nodeType !== 1 || DROP.has(c.tagName)) { c.remove(); continue; }
    cleanNode(c);
    if (!OK.has(c.tagName)) { c.replaceWith(...c.childNodes); continue; }
    for (const a of [...c.attributes]) {
      const n = a.name, v = a.value;
      const keep = (n === 'href' && c.tagName === 'A' && /^(https?:|mailto:)/i.test(v)) ||
        (n === 'src' && c.tagName === 'IMG' && /^(data:image\/(png|jpeg|gif|webp|svg\+xml)[;,]|https?:)/i.test(v)) ||
        (n === 'class' && c.tagName === 'UL' && v === 'todo') ||
        (n === 'data-done' && (v === '0' || v === '1')) ||
        ((n === 'colspan' || n === 'rowspan') && /^\d{1,2}$/.test(v)) ||
        (n === 'alt' && c.tagName === 'IMG');
      if (n === 'style') {
        const okS = v.split(';').map(s => s.trim()).filter(s => /^(color|background-color|text-align|font-weight|text-decoration)\s*:\s*[#\w\s(),.%-]+$/i.test(s)).join(';');

  ed.innerHTML = sanitize(n.html);
  ed.oninput = onEdit;
  ed.onclick = e => {
    const li = e.target.closest && e.target.closest('ul.todo > li');
    if (li && e.target === li && e.offsetX < 26 && !ro) { li.dataset.done = li.dataset.done === '1' ? '0' : '1'; onEdit(); return; }
    const a = e.target.closest && e.target.closest('a');
    if (a && (e.ctrlKey || e.metaKey || ro)) window.open(a.href, '_blank', 'noopener');
  };
  ed.onpaste = e => {
    const files = [...(e.clipboardData.files || [])];
    e.preventDefault();
    if (files.length) { addFiles(files, true); return; }
    const html = e.clipboardData.getData('text/html');
    if (html) document.execCommand('insertHTML', false, sanitize(html));
    else document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
    onEdit();
  };
  ed.ondrop = e => {

    const files = [...(e.dataTransfer.files || [])];
    if (files.length) addFiles(files, true);
    else { const t = e.dataTransfer.getData('text/plain'); if (t) { document.execCommand('insertText', false, t); onEdit(); } }
  };
  ed.onkeydown = e => { if (e.key === 'Tab') { e.preventDefault(); document.execCommand(e.shiftKey ? 'outdent' : 'indent'); } };
  el.append(ed);

  const atts = h('div', { id: 'atts' });
  n.att.forEach((a, i) => atts.append(h('div', { class: 'att' }, '📎', h('a', { href: a.data, download: a.name }, a.name), h('span', { class: 'due' }, fmtSize(a.size)),
    ro ? null : h('button', { title: 'Remove', onclick: () => { n.att.splice(i, 1); n._attDirty = true; touch(n); renderEditor(); } }, '×'))));

}
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function onEdit() { const n = curNote; if (!n || n.trashed) return; n.html = $('#ed').innerHTML; touch(n); }
function touch(n) {
  n.updated = Date.now();
  const it = list.find(x => x.id === n.id); if (it) { it.title = n.title; it.updated = n.updated; it.tags = n.tags; it.nb = n.nb; }
  renderList(); queueNote();
}

/* ---------- note & notebook actions ---------- */
async function newNote(html, titleText) {
  await flushNote();
  if (isPage() || view.type === 'trash') view = { type: 'all' };
  const now = Date.now();
  const n = { title: titleText || '', html: html || '', nb: view.type === 'notebook' ? view.id : S.notebooks[0].id, tags: view.type === 'tag' ? [view.id] : [], pinned: 0, trashed: 0, created: now, updated: now, att: [] };
  try { n.id = (await api.create(Object.assign(noteBody(n), { created: now }))).id; } catch (e) { setStatus('NOT SAVED: could not create the note.', true); return; }
  curNote = n; sel = n.id; q = ''; const s = $('#sidetop input'); if (s) s.value = ''; pane = 'note';
  list.unshift({ id: n.id, title: n.title, snippet: '', nb: n.nb, pinned: 0, trashed: 0, created: now, updated: now, tags: n.tags, att: 0 });
  renderAll(true); refresh();
  setTimeout(() => { const t = $('#ttl'); if (t) t.focus(); }, 0);
}
async function emptyTrash() { if (confirm('Permanently delete all notes in the trash? This cannot be undone.')) { await api.emptyTrash(); curNote = null; sel = null; renderEditor(); refresh(); } }
function createNotebook(name, stack) { const b = { id: newId(), name, stack }; S.notebooks.push(b); scheduleSave(); return b; }
async function editNotebook(b) {
  const name = prompt('Notebook name (leave empty to delete the notebook)', b.name); if (name === null) return;
  if (!name.trim()) {
    if (S.notebooks.length < 2) { alert('You need at least one notebook.'); return; }
    const rest = S.notebooks.filter(x => x !== b);
    if (!confirm('Delete notebook "' + b.name + '"? Its notes move to "' + rest[0].name + '". No notes are deleted.')) return;
    await flushNote(); await api.move(b.id, rest[0].id); S.notebooks = rest;
    if (view.type === 'notebook' && view.id === b.id) view = { type: 'all' };
    if (curNote && curNote.nb === b.id) curNote.nb = rest[0].id;
  } else { b.name = name.trim(); const st = prompt('Stack / group (optional)', b.stack || ''); if (st !== null) b.stack = st.trim(); }
  await saveMeta(); renderAll(true); refresh();
}
async function editTag(t) {
  const nn = prompt('Rename tag (leave empty to remove it from all notes)', t); if (nn === null) return;
  const r = nn.trim().replace(/^#/, '').replace(/\s+/g, '-');
  await flushNote(); await api.renameTag(t, r);
  if (view.type === 'tag' && view.id === t) view = r ? { type: 'tag', id: r } : { type: 'all' };
  if (curNote) { curNote.tags = curNote.tags.filter(x => x !== t); if (r && !curNote.tags.includes(r)) curNote.tags.push(r); renderEditor(); }
  refresh();
}

/* ---------- attachments & images ---------- */
function addFiles(files, inline) {
  const n = curNote; if (!n || n.trashed) return;
  for (const f of files) {
    if (f.size > 8 * 1048576) { alert(f.name + ' is larger than 8 MB and was skipped.'); continue; }
    const r = new FileReader();
    r.onload = () => {
      if (inline && f.type.startsWith('image/')) { $('#ed').focus(); document.execCommand('insertImage', false, r.result); onEdit(); }
      else { n.att.push({ name: f.name, type: f.type, size: f.size, data: r.result }); n._attDirty = true; touch(n); if (curNote === n) renderEditor(); }
    };
    r.readAsDataURL(f);
  }
}
$('#fileAtt').onchange = e => { addFiles([...e.target.files], false); e.target.value = ''; };
$('#fileImg').onchange = e => { addFiles([...e.target.files], true); e.target.value = ''; };

/* ---------- tasks & templates page ---------- */
const BUILTIN = [
  { name: 'Meeting notes', html: '<h2>Meeting notes</h2><p><b>Date:</b> </p><p><b>Attendees:</b> </p><h3>Agenda</h3><ul><li><br></li></ul><h3>Notes</h3><p><br></p><h3>Action items</h3><ul class="todo"><li data-done="0"><br></li></ul>' },
  { name: 'To-do list', html: '<h2>To-do</h2><ul class="todo"><li data-done="0">First task</li><li data-done="0">Second task</li><li data-done="0">Third task</li></ul>' },
  { name: 'Weekly planner', html: '<h2>Week of </h2>' + ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Weekend'].map(d => '<h3>' + d + '</h3><ul class="todo"><li data-done="0"><br></li></ul>').join('') },
  { name: 'Project plan', html: '<h2>Project plan</h2><h3>Goal</h3><p><br></p><h3>Milestones</h3><table><tbody><tr><th>Milestone</th><th>Owner</th><th>Due</th></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table><h3>Risks</h3><ul><li><br></li></ul>' },
  { name: 'Daily journal', html: '<h2>Journal</h2><h3>Grateful for</h3><ul><li><br></li></ul><h3>Today</h3><p><br></p><h3>Reflection</h3><p><br></p>' },
  { name: 'Receipt / expense log', html: '<h2>Expenses</h2><table><tbody><tr><th>Date</th><th>Vendor</th><th>Amount</th><th>Category</th></tr><tr><td><br></td><td><br></td><td><br></td><td><br></td></tr></tbody></table>' },
  { name: 'Class notes', html: '<h2>Course / topic</h2><p><b>Date:</b> </p><h3>Key points</h3><ul><li><br></li></ul><h3>Questions</h3><ul><li><br></li></ul><h3>Assignments</h3><ul class="todo"><li data-done="0"><br></li></ul>' }
];
function renderPage() {
  const el = $('#page'); el.textContent = '';
  if (view.type === 'tasks') {
    const today = new Date().toISOString().slice(0, 10);
    const txt = h('input', { type: 'text', placeholder: 'Add a task…' }), due = h('input', { type: 'date' });
    const add = () => { const t = txt.value.trim(); if (!t) return; S.tasks.push({ id: newId(), text: t, due: due.value, done: false }); scheduleSave(); renderAll(); };
    txt.onkeydown = e => { if (e.key === 'Enter') add(); };
    el.append(h('button', { id: 'back', style: 'margin-bottom:8px', onclick: () => { pane = 'nav'; renderAll(); } }, '‹ Menu'), h('h2', {}, 'Tasks'), h('div', { class: 'addrow' }, txt, due, h('button', { class: 'primary', onclick: add }, 'Add')),
      h('div', { class: 'tabs' }, ...['open', 'done', 'all'].map(t => h('button', { class: taskTab === t ? 'on' : '', onclick: () => { taskTab = t; renderPage(); } }, t[0].toUpperCase() + t.slice(1)))));
    const tl = S.tasks.filter(t => taskTab === 'all' || (taskTab === 'done') === t.done).sort((a, b) => (a.done - b.done) || (a.due || '9').localeCompare(b.due || '9'));
    if (!tl.length) el.append(h('div', { class: 'empty' }, 'Nothing here.'));
    for (const t of tl) {
      const cls = t.done || !t.due ? '' : t.due < today ? ' over' : t.due === today ? ' today' : '';
      const cb = h('input', { type: 'checkbox', checked: t.done }); cb.onchange = () => { t.done = cb.checked; scheduleSave(); renderAll(); };
      el.append(h('div', { class: 'trow' + (t.done ? ' done' : '') }, cb, h('span', { class: 'tx', ondblclick: () => { const v = prompt('Edit task', t.text); if (v && v.trim()) { t.text = v.trim(); scheduleSave(); renderPage(); } } }, t.text),
        t.due ? h('span', { class: 'due' + cls }, (cls === ' over' ? 'Overdue · ' : '') + t.due) : null,
        h('button', { title: 'Delete', onclick: () => { S.tasks = S.tasks.filter(x => x !== t); scheduleSave(); renderAll(); } }, '×')));
    }
  } else if (view.type === 'templates') {
    el.append(h('button', { id: 'back', style: 'margin-bottom:8px', onclick: () => { pane = 'nav'; renderAll(); } }, '‹ Menu'), h('h2', {}, 'Templates'));
    const g = h('div', { class: 'grid' });
    for (const t of BUILTIN) g.append(h('div', { class: 'card', onclick: () => newNote(t.html, t.name) }, h('b', {}, t.name), h('span', {}, 'Built-in')));
    for (const t of S.templates) g.append(h('div', { class: 'card', onclick: () => newNote(t.html, t.name) }, h('b', {}, t.name), h('span', {}, 'Yours · '), h('button', { class: 'danger', onclick: e => { e.stopPropagation(); if (confirm('Delete this template?')) { S.templates = S.templates.filter(x => x !== t); scheduleSave(); renderPage(); } } }, 'Delete')));
    el.append(g);
  }
}

/* ---------- export / import (.enex) ---------- */
function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type || 'text/plain' })), download: name.replace(/[\\/:*?"<>|]/g, '_') });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const enDate = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
function toEnml(html) {
  return sanitize(html).replace(/<ul class="todo">([\s\S]*?)<\/ul>/g, (_, inner) => '<ul>' + inner.replace(/<li data-done="(\d)">/g, (_m, d) => '<li><en-todo' + (d === '1' ? ' checked="true"' : '') + '/>') + '</ul>')
    .replace(/<(br|hr)>/g, '<$1/>').replace(/<img([^>]*?)>/g, '<img$1/>').replace(/&nbsp;/g, '&#160;').replace(/]]>/g, ']]&gt;');
}
function exportEnex(notes, name) {
  if (!notes.length) { alert('No notes to export.'); return; }
  const x = n => n.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let out = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE en-export SYSTEM "http://xml.evernote.com/pub/evernote-export4.dtd">\n<en-export export-date="' + enDate(Date.now()) + '" application="My Notes" version="1">\n';
  for (const n of notes) {
    out += '<note><title>' + x(title(n)) + '</title><content><![CDATA[<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE en-note SYSTEM "http://xml.evernote.com/pub/enml2.dtd"><en-note>' + toEnml(n.html) + '</en-note>]]></content><created>' + enDate(n.created) + '</created><updated>' + enDate(n.updated) + '</updated>' + n.tags.map(t => '<tag>' + x(t) + '</tag>').join('');
    for (const a of n.att) out += '<resource><data encoding="base64">' + a.data.split(',')[1] + '</data><mime>' + x(a.type || 'application/octet-stream') + '</mime><resource-attributes><file-name>' + x(a.name) + '</file-name></resource-attributes></resource>';
    out += '</note>\n';
  }
  download(name + '.enex', out + '</en-export>', 'application/xml');
}
async function exportAll() {
  try {
    const l = await api.list({ view: 'all', sort: 'created', order: 'asc' }), notes = [];
    for (const s of l) notes.push(await api.get(s.id));
    exportEnex(notes, 'all-notes');
  } catch (e) { setStatus('Export failed.', true); }
}
const parseEnDate = s => { const m = /^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z?$/.exec((s || '').trim()); return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : Date.now(); };
$('#fileEnex').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const xml = new DOMParser().parseFromString(await f.text(), 'application/xml');
  if (xml.querySelector('parsererror')) { alert('That file is not valid .enex.'); return; }
  const nb = createNotebook(f.name.replace(/\.(enex|xml)$/i, '') || 'Imported', '');
  let count = 0;
  for (const en of xml.querySelectorAll('note')) {
    const get = t => (en.querySelector(':scope > ' + t) || {}).textContent || '';
    const doc = new DOMParser().parseFromString(get('content'), 'text/html');
    const body = doc.querySelector('en-note') || doc.body;
    body.querySelectorAll('en-todo').forEach(t => t.replaceWith((t.getAttribute('checked') === 'true' ? '☑ ' : '☐ ')));
    const res = [...en.querySelectorAll(':scope > resource')].map(r => ({ mime: (r.querySelector('mime') || {}).textContent || '', data: ((r.querySelector('data') || {}).textContent || '').replace(/\s+/g, ''), name: (r.querySelector('file-name') || {}).textContent || 'attachment' }));
    const imgs = res.filter(r => r.mime.startsWith('image/')); let ii = 0;
    body.querySelectorAll('en-media').forEach(m => { const t = m.getAttribute('type') || ''; if (t.startsWith('image/') && imgs[ii]) { const im = document.createElement('img'); im.src = 'data:' + imgs[ii].mime + ';base64,' + imgs[ii++].data; m.replaceWith(im); } else m.remove(); });
    const att = res.filter(r => !imgs.slice(0, ii).includes(r)).map(r => ({ name: r.name, type: r.mime, size: Math.round(r.data.length * 0.75), data: 'data:' + (r.mime || 'application/octet-stream') + ';base64,' + r.data }));
    const html = sanitize(body.innerHTML);
    try {
      await api.create({ title: get('title'), html, text: textOf(html), nb: nb.id, pinned: 0, trashed: 0, created: parseEnDate(get('created')), updated: parseEnDate(get('updated')), tags: [...en.querySelectorAll(':scope > tag')].map(t => t.textContent.trim()).filter(Boolean), att });
      count++;
    } catch (err) { setStatus('Import stopped after ' + count + ' notes.', true); break; }
  }
  await saveMeta(); go({ type: 'notebook', id: nb.id }); setStatus('Imported ' + count + ' notes'); setTimeout(() => setStatus(''), 2500);
};

/* ---------- theme ---------- */
function cycleTheme() {
  const order = ['auto', 'light', 'dark'], c = document.documentElement.dataset.theme || 'auto', n = order[(order.indexOf(c) + 1) % 3];
  if (n === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = n;
  try { n === 'auto' ? localStorage.removeItem('theme') : localStorage.setItem('theme', n); } catch (e) {}
  setStatus('Theme: ' + n); setTimeout(() => setStatus(''), 1200);
}

setStatus('');
load();
